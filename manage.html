<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tsumiki</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b1a24" />
  <script>(function (r) {
    var h = new Date().getHours();
    var s = "meadow";
    try { s = localStorage.getItem("tsumiki.season") || s; } catch (e) {}
    r.dataset.season = /^(autumn|light|dark)$/.test(s) ? s : "meadow";
    r.dataset.theme = s === "light" || (s !== "dark" && h >= 6 && h < 18) ? "day" : "night";
  })(document.documentElement);</script>
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-apple-touch.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Pixelify+Sans:wght@400..700&family=DotGothic16&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Pixelify+Sans:wght@400..700&family=DotGothic16&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Pixelify+Sans:wght@400..700&family=DotGothic16&display=swap" /></noscript>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="kanji-manage">
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-text">
          <h1>Manage kanji</h1>
          <p>Uncheck a kanji to keep it out of your flashcards.</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="score" id="enabledCount" title="Enabled kanji">✓ <span id="enabledNum">0</span>/300</span>
      </div>
    </header>

    <section class="manage-controls">
      <button class="btn btn-ghost" id="allOnBtn"><span class="btn-icon">✓</span> Enable all</button>
      <button class="btn btn-ghost" id="allOffBtn"><span class="btn-icon">✗</span> Disable all</button>
      <button class="btn btn-flip" id="saveBtn" type="button" disabled><span class="btn-icon">💾</span> Save</button>
      <span class="manage-status" id="saveStatus" role="status" aria-live="polite">All changes saved</span>
      <span class="manage-hint">Each group has 10 kanji. Use the group checkbox to toggle all 10.</span>
    </section>

    <main>
      <div class="table-wrap">
        <table class="manage-table" id="manageTable">
          <tbody id="manageBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="update-toast" id="updateToast" hidden>
    <span class="update-toast-msg">New version available</span>
    <button class="btn btn-flip update-toast-btn" type="button" id="updateToastRefresh">Refresh</button>
    <button class="update-toast-dismiss" type="button" id="updateToastDismiss" aria-label="Dismiss">×</button>
  </div>

  <script src="version.js" defer></script>
  <script src="shell.js" defer></script>
  <script src="conjugate.js" defer></script>
  <script src="data.js" defer></script>
  <script src="manage.js" defer></script>
</body>
</html>
