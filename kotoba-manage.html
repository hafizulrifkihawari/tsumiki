<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>管理 · Manage kotoba</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#171a2e" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-apple-touch.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="kotoba-manage.css" />
</head>
<body>
  <div class="app">
    <a class="back-link" href="kotoba.html">← 言葉 Kotoba</a>

    <header class="topbar">
      <div class="brand">
        <span class="brand-kanji">管理</span>
        <div class="brand-text">
          <h1>Manage kotoba</h1>
          <p>Uncheck a Pelajaran to keep all its words out of your flashcards.</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="score" id="enabledCount" title="Enabled words">✓ <span id="enabledNum">0</span>/0</span>
        <button class="btn btn-ghost" id="updateBtn" type="button" title="Force refresh to the newest version (clears the app cache)">
          <span class="btn-icon">↻</span> <span class="update-label">Force Update</span>
        </button>
        <a class="btn btn-flip" href="kotoba.html">← Flashcards</a>
      </div>
    </header>

    <section class="manage-controls">
      <button class="btn btn-ghost" id="allOnBtn"><span class="btn-icon">✓</span> Enable all</button>
      <button class="btn btn-ghost" id="allOffBtn"><span class="btn-icon">✗</span> Disable all</button>
      <span class="manage-hint">Filters by whole Pelajaran (lesson), not by individual word.</span>
    </section>

    <main>
      <div class="lesson-list" id="lessonList"></div>
    </main>
  </div>

  <div class="update-toast" id="updateToast" hidden>
    <span class="update-toast-msg">New version available</span>
    <button class="btn btn-flip update-toast-btn" type="button" id="updateToastRefresh">Refresh</button>
    <button class="update-toast-dismiss" type="button" id="updateToastDismiss" aria-label="Dismiss">×</button>
  </div>

  <script src="kotoba-data.js"></script>
  <script src="kotoba-manage.js"></script>
  <script>
    // Inline (see index.html) so all of this — including the update
    // notification below — still works even if kotoba-manage.js fails to load.
    if ("serviceWorker" in navigator) {
      var swHadController = !!navigator.serviceWorker.controller;
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then(function (reg) {
          document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") reg.update().catch(function () {});
          });
        }).catch(() => {});
      });

      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (!swHadController) { swHadController = true; return; }
        var toast = document.getElementById("updateToast");
        if (toast) toast.hidden = false;
      });
    }

    (function () {
      var toast = document.getElementById("updateToast");
      var refreshBtn = document.getElementById("updateToastRefresh");
      var dismissBtn = document.getElementById("updateToastDismiss");
      if (refreshBtn) refreshBtn.addEventListener("click", function () { location.reload(); });
      if (dismissBtn) dismissBtn.addEventListener("click", function () { if (toast) toast.hidden = true; });
    })();

    // Force-update escape hatch (see index.html): drop the service worker and
    // every cache, then hard-reload. Inline so it works even if kotoba-manage.js fails.
    (function () {
      var btn = document.getElementById("updateBtn");
      if (!btn) return;
      btn.addEventListener("click", async function () {
        btn.disabled = true;
        var label = btn.querySelector(".update-label");
        if (label) label.textContent = "Updating…";
        try {
          if ("serviceWorker" in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (e) { /* ignore — reload anyway */ }
        var u = new URL(location.href);
        u.searchParams.set("_v", Date.now());
        location.replace(u.href);
      });
    })();
  </script>
</body>
</html>
