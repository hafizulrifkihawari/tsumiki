<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tsumiki</title>
  <meta name="theme-color" content="#0b1a24" />
  <script>(function (r) {
    var h = new Date().getHours();
    r.dataset.theme = h >= 6 && h < 18 ? "day" : "night";
    try { r.dataset.season = localStorage.getItem("tsumiki.season") === "autumn" ? "autumn" : "meadow"; } catch (e) {}
  })(document.documentElement);</script>
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-apple-touch.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tsumiki" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Pixelify+Sans:wght@400..700&family=DotGothic16&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="kotd.css" />
</head>
<body data-page="kotd">
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-text">
          <h1>Kanji of the Day</h1>
          <p>
            <span id="kotdDate"></span> · <span id="kotdCount">0</span> of <span id="kotdTotal">0</span> kanji ·
            <span id="kotdKnownCount">0</span> paham · <span id="kotdRemainCount">0</span> tersisa
          </p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="kotdShuffleAllBtn" type="button" title="Acak ulang ketiga kartu">🔀 Acak semua</button>
        <button class="btn btn-ghost" id="kotdResetKnownBtn" type="button" title="Hapus semua tanda &quot;sudah paham&quot;">↺ Reset paham</button>
      </div>
    </header>

    <p class="kotd-all-known-note" id="kotdAllKnownNote" hidden>
      Semua kanji sudah ditandai paham 🎉 Kartu sekarang diambil dari seluruh daftar lagi.
      Tekan "Reset paham" di atas untuk mulai siklus baru.
    </p>

    <main class="kotd-list" id="kotdList">
      <!-- rendered by kotd.js: today's picks -->
    </main>
  </div>

  <div class="update-toast" id="updateToast" hidden>
    <span class="update-toast-msg">New version available</span>
    <button class="btn btn-flip update-toast-btn" type="button" id="updateToastRefresh">Refresh</button>
    <button class="update-toast-dismiss" type="button" id="updateToastDismiss" aria-label="Dismiss">×</button>
  </div>

  <script src="version.js"></script>
  <script src="shell.js"></script>
  <script src="kotd-data.js"></script>
  <script src="srs.js"></script>
  <script src="kotd.js"></script>
</body>
</html>
