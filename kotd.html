<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>今日 Kanji of the Day — Flashcards</title>
  <meta name="theme-color" content="#171a2e" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-apple-touch.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="今日 KOTD" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="kotd.css" />
</head>
<body>
  <div class="app">
    <a class="back-link" href="index.html">← 漢字 N4</a>

    <header class="topbar">
      <div class="brand">
        <span class="brand-kanji">今日</span>
        <div class="brand-text">
          <h1>Kanji of the Day</h1>
          <p><span id="kotdDate"></span> · 5 of <span id="kotdTotal">0</span> kanji</p>
        </div>
      </div>
      <div class="topbar-actions">
        <a class="btn btn-ghost" href="kotoba.html" title="Kotoba vocabulary flashcards">言葉 Kotoba</a>
        <a class="btn btn-ghost" href="bunpou.html" title="Japanese grammar practice">文法 Bunpou</a>
        <button class="btn btn-ghost" id="updateBtn" type="button" title="Force refresh to the newest version (clears the app cache)">
          <span class="btn-icon">↻</span> <span class="update-label">Force Update</span>
        </button>
      </div>
    </header>

    <main class="kotd-list" id="kotdList">
      <!-- rendered by kotd.js: today's 5 picks -->
    </main>
  </div>

  <div class="update-toast" id="updateToast" hidden>
    <span class="update-toast-msg">New version available</span>
    <button class="btn btn-flip update-toast-btn" type="button" id="updateToastRefresh">Refresh</button>
    <button class="update-toast-dismiss" type="button" id="updateToastDismiss" aria-label="Dismiss">×</button>
  </div>

  <script src="kotd-data.js"></script>
  <script src="srs.js"></script>
  <script src="kotd.js"></script>
  <script>
    // Inline (see index.html/kotoba.html) so this still works even if kotd.js fails to load.
    if ("serviceWorker" in navigator) {
      var swHadController = !!navigator.serviceWorker.controller;
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then(function (reg) {
          document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") reg.update().catch(function () {});
          });
        }).catch(() => {});
      });

      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (!swHadController) { swHadController = true; return; }
        var toast = document.getElementById("updateToast");
        if (toast) toast.hidden = false;
      });
    }

    (function () {
      var toast = document.getElementById("updateToast");
      var refreshBtn = document.getElementById("updateToastRefresh");
      var dismissBtn = document.getElementById("updateToastDismiss");
      if (refreshBtn) refreshBtn.addEventListener("click", function () { location.reload(); });
      if (dismissBtn) dismissBtn.addEventListener("click", function () { if (toast) toast.hidden = true; });
    })();

    // Force-update escape hatch (see index.html): drop the service worker and
    // every cache, then hard-reload. Inline so it works even if kotd.js fails.
    (function () {
      var btn = document.getElementById("updateBtn");
      if (!btn) return;
      btn.addEventListener("click", async function () {
        btn.disabled = true;
        var label = btn.querySelector(".update-label");
        if (label) label.textContent = "Updating…";
        try {
          if ("serviceWorker" in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (e) { /* ignore — reload anyway */ }
        var u = new URL(location.href);
        u.searchParams.set("_v", Date.now());
        location.replace(u.href);
      });
    })();
  </script>
</body>
</html>
