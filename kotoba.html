<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>言葉 Kotoba — Flashcards</title>
  <meta name="theme-color" content="#171a2e" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-apple-touch.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="言葉 Kotoba" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="kotoba.css" />
</head>
<body>
  <div class="app">
    <a class="back-link" href="index.html">← 漢字 N4</a>

    <header class="topbar">
      <div class="brand">
        <span class="brand-kanji">言葉</span>
        <div class="brand-text">
          <h1>Kotoba Flashcards</h1>
          <p>Pelajaran 26 · <span id="wordCount">0</span> words · <span id="dueCount">0</span> due</p>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-count">
          <span id="posNow">1</span> / <span id="posTotal">1</span>
          <span class="queue-badge" id="queueBadge" hidden title="Cards graded Again, waiting to come back this session">↺ <span id="queueCount">0</span></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="topbar-actions">
        <a class="btn btn-ghost" href="kotd.html" title="Kanji of the day">今日 KOTD</a>
        <button class="btn btn-ghost" id="updateBtn" type="button" title="Force refresh to the newest version (clears the app cache)">
          <span class="btn-icon">↻</span> <span class="update-label">Force Update</span>
        </button>
      </div>
    </header>

    <main class="stage">
      <button class="nav-arrow" id="prevBtn" aria-label="Previous card">‹</button>

      <div class="card-scene has-answerbar" id="cardScene">
        <div class="card" id="card">
          <!-- FRONT: hiragana/katakana first — learn it as a word before the kanji -->
          <div class="card-face card-front">
            <div class="card-top">
              <span class="lesson-badge" id="frontLesson">Pelajaran 26</span>
            </div>
            <div class="card-center">
              <div class="word-display" id="frontKana">みます</div>
              <div class="kotoba-kanji" id="frontKanji"></div>
              <div class="kotoba-context" id="frontContext" hidden></div>
              <button class="speak-btn" id="speakFrontBtn" type="button" aria-label="Play pronunciation" title="Play pronunciation (P)">🔊</button>
            </div>
            <div class="card-bottom">
              <span class="hint-text">Tap or swipe · Space to flip</span>
            </div>
          </div>

          <!-- BACK -->
          <div class="card-face card-back">
            <div class="card-top">
              <span class="badge badge-type" id="backType">Kata Benda</span>
            </div>
            <div class="card-center">
              <div class="reading-row">
                <span class="reading-shown" id="backKana">みます</span>
              </div>
              <div class="kotoba-kanji" id="backKanji"></div>
              <div class="kotoba-context" id="backContext" hidden></div>
              <div class="meaning-row">
                <span class="meaning-id" id="backMeaning">melihat, memeriksa</span>
              </div>
            </div>
            <div class="card-bottom">
              <span class="hint-text">Swipe or ← → to move · Grade: Again / Good / Easy</span>
            </div>
          </div>
        </div>

        <div class="answerbar" id="answerbar">
          <div class="answerbar-stats">
            <div class="score" id="score" title="Correct this session">
              <span class="score-icon">✓</span><span id="scoreCount">0</span>
            </div>
            <div class="miss" id="miss" title="Missed this session">
              <span class="miss-icon">✗</span><span id="missCount">0</span>
            </div>
          </div>
          <div class="answerbar-buttons">
            <button class="btn btn-again" id="againBtn" title="Didn't recall it — comes back soon (1 / N / ↓)">
              <span class="btn-icon">↺</span> Again
            </button>
            <button class="btn btn-good" id="goodBtn" title="Got it (2 / Y / ↑)">
              <span class="btn-icon">✓</span> Good
            </button>
            <button class="btn btn-easy" id="easyBtn" title="Knew it well (3)">
              <span class="btn-icon">⚡</span> Easy
            </button>
          </div>
        </div>
      </div>

      <button class="nav-arrow" id="nextBtn" aria-label="Next card">›</button>
    </main>

    <footer class="actionbar">
      <button class="btn btn-ghost" id="shuffleBtn" title="Shuffle (S)">
        <span class="btn-icon">⇄</span> Shuffle
      </button>
      <button class="btn btn-ghost" id="resetBtn" title="Study in order (un-shuffle)">
        <span class="btn-icon">↺</span> In order
      </button>
      <div class="spacer"></div>
      <button class="btn btn-flip" id="flipBtn">Flip card</button>
    </footer>
  </div>

  <div class="update-toast" id="updateToast" hidden>
    <span class="update-toast-msg">New version available</span>
    <button class="btn btn-flip update-toast-btn" type="button" id="updateToastRefresh">Refresh</button>
    <button class="update-toast-dismiss" type="button" id="updateToastDismiss" aria-label="Dismiss">×</button>
  </div>

  <script src="kotoba-data.js"></script>
  <script src="srs.js"></script>
  <script src="kotoba-app.js"></script>
  <script>
    // Inline (see index.html) so all of this — including the update
    // notification below — still works even if kotoba-app.js fails to load.
    if ("serviceWorker" in navigator) {
      var swHadController = !!navigator.serviceWorker.controller;
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then(function (reg) {
          document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") reg.update().catch(function () {});
          });
        }).catch(() => {});
      });

      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (!swHadController) { swHadController = true; return; }
        var toast = document.getElementById("updateToast");
        if (toast) toast.hidden = false;
      });
    }

    (function () {
      var toast = document.getElementById("updateToast");
      var refreshBtn = document.getElementById("updateToastRefresh");
      var dismissBtn = document.getElementById("updateToastDismiss");
      if (refreshBtn) refreshBtn.addEventListener("click", function () { location.reload(); });
      if (dismissBtn) dismissBtn.addEventListener("click", function () { if (toast) toast.hidden = true; });
    })();

    // Force-update escape hatch (see index.html): drop the service worker and
    // every cache, then hard-reload. Inline so it works even if kotoba-app.js fails.
    (function () {
      var btn = document.getElementById("updateBtn");
      if (!btn) return;
      btn.addEventListener("click", async function () {
        btn.disabled = true;
        var label = btn.querySelector(".update-label");
        if (label) label.textContent = "Updating…";
        try {
          if ("serviceWorker" in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (e) { /* ignore — reload anyway */ }
        var u = new URL(location.href);
        u.searchParams.set("_v", Date.now());
        location.replace(u.href);
      });
    })();
  </script>
</body>
</html>
