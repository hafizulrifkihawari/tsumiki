<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tsumiki</title>
  <meta name="theme-color" content="#0b1a24" />
  <script>(function (r) {
    var h = new Date().getHours();
    var s = "meadow";
    try { s = localStorage.getItem("tsumiki.season") || s; } catch (e) {}
    r.dataset.season = /^(autumn|light|dark)$/.test(s) ? s : "meadow";
    r.dataset.theme = s === "light" || (s !== "dark" && h >= 6 && h < 18) ? "day" : "night";
  })(document.documentElement);</script>
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-apple-touch.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tsumiki" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Pixelify+Sans:wght@400..700&family=DotGothic16&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Pixelify+Sans:wght@400..700&family=DotGothic16&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Pixelify+Sans:wght@400..700&family=DotGothic16&display=swap" /></noscript>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="kotoba.css" />
</head>
<body data-page="kotoba">
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-text">
          <h1>Kotoba Flashcards</h1>
          <p><span id="wordCount">0</span> words · <span id="dueCount">0</span> due</p>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-count" title="Cards due for review right now — tap Study all to see every word in the selected lesson(s)">
          <span id="posNow">1</span> / <span id="posTotal">1</span>
          <span class="queue-badge" id="queueBadge" hidden title="Cards graded Again, waiting to come back this session">↺ <span id="queueCount">0</span></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </header>

    <section class="controls">
      <div class="control-group">
        <label class="switch" title="Show the meaning first, recall the Japanese word (R)">
          <input type="checkbox" id="reverseMode" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="switch-label">Reverse (meaning → Japanese)</span>
        </label>
      </div>
    </section>

    <main class="stage">
      <button class="nav-arrow" id="prevBtn" aria-label="Previous card">‹</button>

      <div class="card-scene has-answerbar" id="cardScene">
        <div class="card" id="card">
          <!-- FRONT: hiragana/katakana first — learn it as a word before the kanji -->
          <div class="card-face card-front">
            <div class="card-top">
              <span class="lesson-badge" id="frontLesson">Pelajaran 26</span>
              <span class="badge badge-type" id="frontType" hidden></span>
            </div>
            <div class="card-center">
              <div class="word-display" id="frontKana">みます</div>
              <div class="kotoba-kanji" id="frontKanji"></div>
              <div class="kotoba-context" id="frontContext" hidden></div>
              <!-- Reverse mode: the meaning is the prompt, the word is the answer -->
              <div class="kotoba-front-meaning" id="frontMeaning" hidden></div>
              <button class="speak-btn" id="speakFrontBtn" type="button" aria-label="Play pronunciation" title="Play pronunciation (P)">🔊</button>
            </div>
            <div class="card-bottom">
              <span class="hint-text" id="frontHint">Tap or swipe · Space to flip</span>
            </div>
          </div>

          <!-- BACK -->
          <div class="card-face card-back">
            <div class="card-top">
              <div class="card-top-badges">
                <span class="badge badge-type" id="backType">Kata Benda</span>
              </div>
            </div>
            <div class="card-center">
              <div class="reading-row">
                <span class="reading-shown" id="backKana">みます</span>
              </div>
              <div class="kotoba-kanji" id="backKanji"></div>
              <div class="kotoba-context" id="backContext" hidden></div>
              <div class="meaning-row">
                <span class="meaning-id" id="backMeaning">melihat, memeriksa</span>
              </div>
              <button class="speak-btn" id="speakBackBtn" type="button" aria-label="Play pronunciation" title="Play pronunciation (P)" hidden>🔊</button>
            </div>
            <div class="card-bottom">
              <span class="hint-text">Swipe or ← → to move · Grade: Again / Good / Easy</span>
            </div>
          </div>
        </div>

        <div class="answerbar" id="answerbar">
          <div class="answerbar-stats">
            <div class="score" id="score" title="Correct this session">
              <span class="score-icon">✓</span><span id="scoreCount">0</span>
            </div>
            <div class="miss" id="miss" title="Missed this session">
              <span class="miss-icon">✗</span><span id="missCount">0</span>
            </div>
          </div>
          <div class="answerbar-buttons">
            <button class="btn btn-again" id="againBtn" title="Didn't recall it — comes back soon (1 / N / ↓)">
              <span class="btn-icon">↺</span> Again
            </button>
            <button class="btn btn-good" id="goodBtn" title="Got it (2 / Y / ↑)">
              <span class="btn-icon">✓</span> Good
            </button>
            <button class="btn btn-easy" id="easyBtn" title="Knew it well (3)">
              <span class="btn-icon">⚡</span> Easy
            </button>
          </div>
        </div>
      </div>

      <button class="nav-arrow" id="nextBtn" aria-label="Next card">›</button>
    </main>

    <footer class="actionbar">
      <button class="btn btn-ghost" id="shuffleBtn" title="Shuffle (S)">
        <span class="btn-icon">⇄</span> Shuffle
      </button>
      <button class="btn btn-ghost" id="resetBtn" title="Study in order (un-shuffle)">
        <span class="btn-icon">↺</span> In order
      </button>
      <button class="btn btn-ghost" id="studyAllBtn" title="Study every enabled word in this lesson, including ones not due yet">
        <span class="btn-icon">📚</span> Study all
      </button>
      <div class="spacer"></div>
      <button class="btn btn-flip" id="flipBtn">Flip card</button>
    </footer>
  </div>

  <!-- Pelajaran word list. Deliberately a sibling of .app, not a child of
       #cardScene — the swipe handler lives on #cardScene, so markup inside it
       would turn a scroll of this list into a next/prev card. -->
  <button class="kotoba-tab" id="listTab" type="button"
          aria-expanded="false" aria-controls="lessonDrawer"
          title="Daftar kata Pelajaran ini">‹</button>

  <div class="kotoba-backdrop" id="listBackdrop" hidden></div>

  <aside class="kotoba-drawer" id="lessonDrawer" aria-label="Daftar kata Pelajaran">
    <div class="kotoba-drawer-head">
      <button class="nav-arrow" id="lessonPrevBtn" type="button" aria-label="Pelajaran sebelumnya">‹</button>
      <div class="kotoba-drawer-title">
        <span id="drawerLesson">Pelajaran 26</span>
        <span class="kotoba-drawer-meta" id="drawerMeta">0 kata</span>
      </div>
      <button class="nav-arrow" id="lessonNextBtn" type="button" aria-label="Pelajaran berikutnya">›</button>
    </div>
    <div class="kotoba-word-list" id="wordList"></div>
  </aside>

  <div class="update-toast" id="updateToast" hidden>
    <span class="update-toast-msg">New version available</span>
    <button class="btn btn-flip update-toast-btn" type="button" id="updateToastRefresh">Refresh</button>
    <button class="update-toast-dismiss" type="button" id="updateToastDismiss" aria-label="Dismiss">×</button>
  </div>

  <script src="version.js" defer></script>
  <script src="shell.js" defer></script>
  <script src="kotoba-data.js" defer></script>
  <script src="srs.js" defer></script>
  <script src="kotoba-app.js" defer></script>
</body>
</html>
